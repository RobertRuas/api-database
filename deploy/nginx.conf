# ============================================================
#  Nginx reverse proxy para database.windlog.org.
#
#  Instale em: /etc/nginx/sites-available/database.windlog.org
#  Ative: ln -s ../sites-available/database.windlog.org /etc/nginx/sites-enabled/
#  SSL: use `certbot --nginx -d database.windlog.org`
# ============================================================

# Redireciona HTTP para HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name database.windlog.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name database.windlog.org;

    # Preenchidos pelo certbot:
    # ssl_certificate     /etc/letsencrypt/live/database.windlog.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/database.windlog.org/privkey.pem;

    # Upload grande (ajuste conforme MAX_FILE_SIZE do .env — aqui 100 MB).
    client_max_body_size 100M;
    client_body_timeout 300s;

    # Headers de segurança básicos (a API já envia via Helmet, mas reforçamos).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Proxy para o container da API escutando na 3000.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Streams de upload/download precisam de timeouts generosos.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering     off;
    }

    # Healthcheck direto, sem cache.
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }
}
